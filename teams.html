<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Team Selection - Gully Cricket Scorer</title>
    
    <!-- Firebase Realtime Database SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #090d16);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #f8fafc;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link a {
            color: #94a3b8;
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover {
            color: #38bdf8;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 15px;
            flex-grow: 1;
            overflow: hidden;
        }

        .panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .panel h3 {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drop-zone, .player-pool {
            flex-grow: 1;
            background: rgba(10, 15, 30, 0.6);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 200px;
        }

        .drop-zone.drag-over {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
        }

        .player-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .player-card:active {
            cursor: grabbing;
        }

        .player-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .team-config-group {
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            margin-bottom: 6px;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 4px;
        }

        .remove-icon {
            color: #f87171;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-header">
        <h2>🛡️ Pro Team Selector & Telegram Integration</h2>
        <div class="back-link">
            <a href="index.html">🏠 Back to Home</a>
        </div>
    </div>

    <div class="workspace">
        <!-- Left Panel: Available Players -->
        <div class="panel">
            <h3>👥 Available Players <span id="poolCount" style="font-size: 11px; background: rgba(56,189,248,0.2); padding: 2px 8px; border-radius: 10px;">0</span></h3>
            <p style="font-size: 11px; color: #94a3b8; margin-bottom: 8px;">Drag players from here to any team:</p>
            <div class="player-pool" id="playerPool" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToPool(event)"></div>
        </div>

        <!-- Center Panel: Team 1 Builder -->
        <div class="panel">
            <div class="team-config-group">
                <input type="text" id="team1Name" placeholder="Enter Team 1 Name..." value="Team Alpha">
            </div>
            <h3>🛡️ Team 1 Squad <span id="team1Count" style="font-size: 11px; background: rgba(56,189,248,0.2); padding: 2px 8px; border-radius: 10px;">0</span></h3>
            <div class="drop-zone" id="team1DropZone" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToTeam(event, 'team1')">
                <p style="color: #64748b; font-size: 11px; text-align: center; margin: auto;">Drop players here</p>
            </div>
            <button class="action-btn" onclick="saveTeam('team1')">Save Team 1 & Send Telegram</button>
        </div>

        <!-- Right Panel: Team 2 Builder -->
        <div class="panel">
            <div class="team-config-group">
                <input type="text" id="team2Name" placeholder="Enter Team 2 Name..." value="Team Beta">
            </div>
            <h3>⚔️ Team 2 Squad <span id="team2Count" style="font-size: 11px; background: rgba(56,189,248,0.2); padding: 2px 8px; border-radius: 10px;">0</span></h3>
            <div class="drop-zone" id="team2DropZone" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropToTeam(event, 'team2')">
                <p style="color: #64748b; font-size: 11px; text-align: center; margin: auto;">Drop players here</p>
            </div>
            <button class="action-btn" style="background: linear-gradient(135deg, #ec4899, #be185d);" onclick="saveTeam('team2')">Save Team 2 & Send Telegram</button>
        </div>
    </div>

    <script>
        // 🛠️ Firebase કન્ફિગરેશન
        const firebaseConfig = {
            apiKey: "AIzaSyAlZjpevvcgMYmxw3qrLg2wSPyE...",
            authDomain: "vskcricket.firebaseapp.com",
            databaseURL: "https://vskcricket-default-rtdb.firebaseio.com",
            projectId: "vskcricket"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 🤖 Telegram Bot Credentials (અહીં તમારું બોટ ટોકન અને ચેટ આઈડી નાખો)
        const TELEGRAM_BOT_TOKEN = "8681899166:AAGylxqHZGXS0KrXjmbRI_ETtnSO0i7sQzE"; 
        const TELEGRAM_CHAT_ID = "680623524";

        let cloudPlayers = [];
        let team1Players = [];
        let team2Players = [];

        // 1. Firebase માંથી પ્લેયર્સ લોડ કરવા[cite: 1]
        db.ref('players').on('value', (snapshot) => {
            const data = snapshot.val();
            cloudPlayers = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    let playerName = data[key].name;
                    if (!team1Players.includes(playerName) && !team2Players.includes(playerName)) {
                        cloudPlayers.push(playerName);
                    }
                });
            }
            renderUI();
        });

        // 2. UI રેન્ડર ફંક્શન
        function renderUI() {
            const poolContainer = document.getElementById('playerPool');
            const team1Container = document.getElementById('team1DropZone');
            const team2Container = document.getElementById('team2DropZone');

            poolContainer.innerHTML = '';
            if (cloudPlayers.length === 0) {
                poolContainer.innerHTML = `<p style="color: #f87171; font-size: 11px; text-align: center; margin: auto;">કોઈ ઉપલબ્ધ ખેલાડી બાકી નથી!</p>`;
            } else {
                cloudPlayers.forEach(player => {
                    poolContainer.innerHTML += createPlayerCard(player, 'pool');
                });
            }
            document.getElementById('poolCount').innerText = cloudPlayers.length;

            team1Container.innerHTML = '';
            if (team1Players.length === 0) {
                team1Container.innerHTML = `<p style="color: #64748b; font-size: 11px; text-align: center; margin: auto;">Drop players here</p>`;
            } else {
                team1Players.forEach(player => {
                    team1Container.innerHTML += createPlayerCard(player, 'team1');
                });
            }
            document.getElementById('team1Count').innerText = team1Players.length;

            team2Container.innerHTML = '';
            if (team2Players.length === 0) {
                team2Container.innerHTML = `<p style="color: #64748b; font-size: 11px; text-align: center; margin: auto;">Drop players here</p>`;
            } else {
                team2Players.forEach(player => {
                    team2Container.innerHTML += createPlayerCard(player, 'team2');
                });
            }
            document.getElementById('team2Count').innerText = team2Players.length;
        }

        function createPlayerCard(playerName, origin) {
            return `
                <div class="player-card" draggable="true" ondragstart="drag(event)" data-player="${playerName}" data-origin="${origin}">
                    <span>🏏 ${playerName}</span>
                    ${origin !== 'pool' ? `<span class="remove-icon" onclick="removeFromTeam('${playerName}', '${origin}')">&times;</span>` : ''}
                </div>
            `;
        }

        // --- Drag and Drop Logic ---
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeDropStyle(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text/plain", ev.target.dataset.player);
            ev.dataTransfer.setData("origin", ev.target.dataset.origin);
        }

        function dropToTeam(ev, targetTeam) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            
            const playerName = ev.dataTransfer.getData("text/plain");
            const origin = ev.dataTransfer.getData("origin");

            if (!playerName) return;

            removePlayerFromList(playerName, origin);

            if (targetTeam === 'team1' && !team1Players.includes(playerName)) {
                team1Players.push(playerName);
            } else if (targetTeam === 'team2' && !team2Players.includes(playerName)) {
                team2Players.push(playerName);
            }

            renderUI();
        }

        function dropToPool(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');

            const playerName = ev.dataTransfer.getData("text/plain");
            const origin = ev.dataTransfer.getData("origin");

            if (!playerName || origin === 'pool') return;

            removePlayerFromList(playerName, origin);
            if (!cloudPlayers.includes(playerName)) {
                cloudPlayers.push(playerName);
            }

            renderUI();
        }

        function removePlayerFromList(playerName, origin) {
            if (origin === 'pool') {
                cloudPlayers = cloudPlayers.filter(p => p !== playerName);
            } else if (origin === 'team1') {
                team1Players = team1Players.filter(p => p !== playerName);
            } else if (origin === 'team2') {
                team2Players = team2Players.filter(p => p !== playerName);
            }
        }

        function removeFromTeam(playerName, origin) {
            removePlayerFromList(playerName, origin);
            if (!cloudPlayers.includes(playerName)) {
                cloudPlayers.push(playerName);
            }
            renderUI();
        }

        // 3. ટીમ સેવ કરવી અને ટેલિગ્રામ પર મોકલવી
        function saveTeam(teamKeyId) {
            let teamNameInput = document.getElementById(teamKeyId === 'team1' ? 'team1Name' : 'team2Name');
            let teamName = teamNameInput.value.trim();
            let playersList = teamKeyId === 'team1' ? team1Players : team2Players;

            if (teamName === '') {
                alert('કૃપા કરીને ટીમનું નામ દાખલ કરો!');
                return;
            }

            if (playersList.length === 0) {
                alert('ટીમમાં ઓછામાં ઓછો એક ખેલાડી હોવો જરૂરી છે!');
                return;
            }

            // Firebase માં સેવ કરો[cite: 1]
            db.ref('teams').push({
                name: teamName,
                players: playersList
            }).then(() => {
                // Telegram પર મેસેજ મોકલો
                sendToTelegram(teamName, playersList);
            }).catch((error) => {
                alert('એરર: ' + error.message);
            });
        }

        // 4. Telegram API દ્વારા મેસેજ મોકલવાનું ફંક્શન
        function sendToTelegram(teamName, players) {
            if (TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN" || TELEGRAM_CHAT_ID === "YOUR_CHAT_ID") {
                alert('ટીમ Firebase માં સેવ થઈ ગઈ છે, પણ Telegram Bot Token અથવા Chat ID સેટ કરેલ નથી!');
                return;
            }

            let message = `🚨 *NEW CRICKET TEAM SAVED* 🚨\n\n`;
            message += `🛡️ *Team Name:* ${teamName}\n`;
            message += `👥 *Total Players:* ${players.length}\n\n`;
            message += `📜 *Players List:*\n`;
            players.forEach((player, index) => {
                message += `${index + 1}. ${player}\n`;
            });

            let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert(`સફળતાપૂર્વક ${teamName} સેવ થઈ અને Telegram પર મેસેજ મોકલાઈ ગયો!`);
                } else {
                    alert('ટીમ સેવ થઈ ગઈ, પણ Telegram પર મેસેજ મોકલવામાં ભૂલ છે: ' + data.description);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Telegram સાથે કનેક્ટ થવામાં સમસ્યા આવી.');
            });
        }
    </script>
</body>
</html>
