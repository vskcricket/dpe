<!DOCTYPE html>
<html>

<head>

<title>Edit Team</title>

<link rel="stylesheet" href="css/style.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }

    /* 1. Dynamic Animated Gradient Background */
    body {
        background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #090d16);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        color: #f8fafc;
        width: 100vw;
        height: 100vh;
        overflow: hidden; /* બહારનું સ્ક્રોલ કાયમ માટે બંધ */
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* 2. Landscape & Space Optimized Container */
    .container, .home-container {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 22px;
        padding: 22px 28px;
        width: 100%;
        max-width: 750px;
        max-height: 90vh;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* 3. Modern Headings */
    h2, .home-title, h3 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 15px;
        background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 10px;
    }

    /* 4. Text & Tables Visibility Fix */
    td, th, p, label, span {
        color: #f1f5f9 !important;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
        margin-top: 10px;
    }

    th {
        background: rgba(15, 23, 42, 0.95) !important;
        color: #38bdf8 !important;
        padding: 10px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid #38bdf8 !important;
    }

    td {
        background: rgba(30, 41, 59, 0.85) !important;
        padding: 12px 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 13px;
        font-weight: 500;
    }

    tr td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
    tr td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

    tr:hover td {
        background: rgba(56, 189, 248, 0.2) !important;
    }

    /* 5. Inputs & Buttons */
    input[type="text"], select {
        width: 100%;
        background: rgba(15, 23, 42, 0.95) !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        color: #ffffff !important;
        padding: 12px 15px;
        border-radius: 12px;
        font-size: 13px;
        outline: none;
        margin-bottom: 12px;
    }

    input[type="text"]:focus, select:focus {
        border-color: #38bdf8 !important;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    button, .menu-btn {
        width: 100%;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        transition: all 0.3s ease;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 10px;
    }

    button:hover, .menu-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.15);
        box-shadow: 0 12px 25px rgba(59, 130, 246, 0.6);
    }

    /* Scrollable Box for Data if needed inside */
    .scrollable-content {
        max-height: 55vh;
        overflow-y: auto;
        padding-right: 5px;
    }
    .scrollable-content::-webkit-scrollbar {
        width: 4px;
    }
    .scrollable-content::-webkit-scrollbar-thumb {
        background: #38bdf8;
        border-radius: 4px;
    }
</style>

</head>


<body>

<header>
✏️ EDIT TEAM
</header>


<div class="container">

<div class="card">


<input 
id="editTeamName"
placeholder="Team Name">


<h3>Select Players</h3>


<select 
id="editTeamPlayers"
multiple
style="width:100%;height:180px;">
</select>


<br><br>


<button onclick="saveTeamEdit()">

💾 Save Changes

</button>


<button onclick="location.href='teams.html'">

⬅ Back

</button>


</div>

</div>


<script src="js/team-edit.js"></script>


</body>

</html>
